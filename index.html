      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Open Lakehouse",
        "url": "https://openlakehouse.io",
        "description": "The Open Lakehouse: your data in open formats on storage you control, readable by any engine.",
        "sameAs": [
          "https://delta.io",
          "https://iceberg.apache.org",
          "https://unitycatalog.io",
          "https://mlflow.org",
          "https://spark.apache.org"
        ]
      }
